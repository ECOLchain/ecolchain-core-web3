<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f6b5c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EcolChain</title>
    <script>
      // Aplica tema e tamanho de fonte antes da primeira pintura (evita piscar).
      try {
        var p = JSON.parse(localStorage.getItem('ecolchain:preferencias') || '{}');
        var escuro = p.tema === 'escuro' || (p.tema !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', escuro);
        if (p.fonte) document.documentElement.dataset.fonte = p.fonte;
        if (p.idioma) document.documentElement.lang = p.idioma;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
